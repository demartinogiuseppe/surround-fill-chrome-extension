<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 230px; }
  h1 { font-size: 13px; margin: 0 0 2px; color: #555; font-weight: 600; }
  #mode { font-size: 12px; color: #1a7f37; margin: 0 0 10px; }
  #mode.warn { color: #b35900; }
  label { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; cursor: pointer; }
  label.off { color: #aaa; cursor: default; }
  small { color: #888; font-size: 11px; }
  input { width: 18px; height: 18px; cursor: pointer; }
</style>
</head>
<body>
  <h1>Surround Fill</h1>
  <p id="mode">Rilevo l'uscita audio…</p>
  <label>Posteriori (L/R) <input type="checkbox" id="enabled"></label>
  <label id="sideLabel">Laterali (L/R) <small>solo 7.1</small> <input type="checkbox" id="side"></label>
  <label>Centrale <input type="checkbox" id="center"></label>
  <label>Subwoofer <small>bassi &lt; 120 Hz</small> <input type="checkbox" id="sub"></label>
  <script src="popup.js"></script>
</body>
</html>
